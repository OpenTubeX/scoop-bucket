name: Update manifests

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag (defaults to the latest stable release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-manifests
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.update.outputs.apps }}
      revision: ${{ steps.update.outputs.revision }}
    steps:
      # Check out the branch as it is now. A queued run's event commit can be outdated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Resolve release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/update.py ${TAG:+"$TAG"}
          apps="$(git diff --name-only -- bucket | jq --raw-input --slurp --compact-output \
            'split("\n") | map(select(length > 0) | ltrimstr("bucket/") | rtrimstr(".json"))')"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.update.outputs.apps != '[]'
        with:
          name: manifests
          path: bucket/

  test:
    needs: prepare
    if: needs.prepare.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: bucket
      - run: ./scripts/test-install.ps1 -App '${{ matrix.app }}'

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: bucket
      - name: Publish tested manifests in one GitHub-signed commit
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ needs.prepare.outputs.apps }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.revision }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          names = {'opentubex': 'OpenTubeX', 'opentubex-nightly': 'OpenTubeX Nightly'}
          additions, versions = [], {}
          for app in json.loads(os.environ['APPS']):
              path = f'bucket/{app}.json'
              source = Path(path).read_bytes()
              additions.append({'path': path, 'contents': base64.b64encode(source).decode()})
              versions.setdefault(json.loads(source)['version'], []).append(names[app])
          headline = 'chore: update ' + ', '.join(
              f'{" and ".join(apps)} to {version}' for version, apps in versions.items())
          request = {
              'query': 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }',
              'variables': {'input': {
                  'branch': {'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                             'branchName': os.environ['GITHUB_REF_NAME']},
                  'expectedHeadOid': os.environ['EXPECTED_HEAD'],
                  'message': {'headline': headline},
                  'fileChanges': {'additions': additions},
              }},
          }
          Path('commit-request.json').write_text(json.dumps(request))
          PY
          # GitHub signs this commit and rejects it if the branch moved since the manifests were tested.
          gh api graphql --input commit-request.json
